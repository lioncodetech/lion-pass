name: LionPass
options:
  bundleIdPrefix: com.lioncodetech
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 42J2NZ3WA4
    CODE_SIGN_STYLE: Automatic
targets:
  LionPass:
    type: application
    platform: iOS
    sources:
      - path: Sources/LionPass
      - path: Sources/LionCore
      - path: Sources/LionAssets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lioncodetech.lionpassword
        PRODUCT_NAME: Lion Pass
        INFOPLIST_FILE: Sources/LionPass/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LionPass/LionPass.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LionAutoFill
  LionAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LionAutoFill
      - path: Sources/LionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lioncodetech.lionpassword.autofill
        PRODUCT_NAME: Lion AutoFill
        INFOPLIST_FILE: Sources/LionAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LionAutoFill/LionAutoFill.entitlements
  LionCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/LionCoreTests
    dependencies:
      - target: LionPass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lion Pass.app/Lion Pass"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LionCoreMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: Tests/LionCoreTests
    dependencies:
      - target: LionPassMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lion Pass.app/Contents/MacOS/Lion Pass"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LionPassMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/LionPassMac
      - path: Sources/LionCore
      - path: Sources/LionAssets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lioncodetech.lionpassword.mac
        PRODUCT_NAME: Lion Pass
        INFOPLIST_FILE: Sources/LionPassMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LionPassMac/LionPassMac.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 42J2NZ3WA4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        REGISTER_APP_WITH_LAUNCH_SERVICES: NO
schemes:
  LionPass:
    build:
      targets:
        LionPass: all
        LionAutoFill: all
        LionCoreTests: [test]
    test:
      targets: [LionCoreTests]
  LionPassMac:
    build:
      targets:
        LionPassMac: all
    run:
      config: Debug
    test:
      targets: [LionCoreMacTests]

name: Windows

on:
  push:
    paths: ["windows/**", "shared/**", "apple/Sources/LionAssets/Localizable.xcstrings", ".github/workflows/windows-build.yml"]
  pull_request:
    paths: ["windows/**", "shared/**", "apple/Sources/LionAssets/Localizable.xcstrings", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-dotnet v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - name: Test core
        run: dotnet test shared/dotnet/LionPass.Core.Tests/LionPass.Core.Tests.csproj -c Release
      - name: Validate WinUI XAML resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appXaml = Get-Content "windows/src/LionPass.Client.noindex/App.xaml" -Raw
          if ($appXaml -notmatch '<XamlControlsResources\b') {
            throw "App.xaml deve carregar XamlControlsResources para fornecer os estilos nativos do WinUI."
          }

          $implicitIcons = Get-ChildItem "windows/src/LionPass.Client.noindex" -Recurse -Filter *.xaml |
            Select-String -Pattern '\sIcon="[^"{][^"]*"'
          if ($implicitIcons) {
            $implicitIcons | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Use IconElement explícito, por exemplo <SymbolIcon Symbol="Add" />, em vez de Icon="Add".'
          }
      - name: Build WinUI
        working-directory: windows
        run: dotnet build src/LionPass.Client.noindex/LionPass.App.csproj -c Release -p:Platform=${{ matrix.architecture }} -p:SelfContained=false
      - name: Install verified Inno Setup
        if: matrix.architecture == 'x64'
        shell: pwsh
        env:
          INNO_VERSION: "6.7.3"
          INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:INNO_SHA256) {
            throw "SHA-256 inválido para Inno Setup: $actualHash"
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Assinatura Authenticode inválida para Inno Setup: $($signature.Status)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Instalação do Inno Setup falhou com código $($process.ExitCode)"
          }
      - name: Build installer
        if: matrix.architecture == 'x64'
        working-directory: windows
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Architecture x64
      - name: Smoke-test packaged application startup
        if: matrix.architecture == 'x64'
        working-directory: windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "installer\output" -Filter "LionPass-Windows-x64-*-Setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Era esperado exatamente um instalador x64, mas foram encontrados $($installers.Count)."
          }
          $installer = $installers[0].FullName
          $installRoot = Join-Path $env:RUNNER_TEMP "LionPass-Smoke"
          $diagnosticsDirectory = Join-Path $env:LOCALAPPDATA "Lion Code Technology\Lion Pass\Logs"
          $startupMarker = Join-Path $diagnosticsDirectory "startup.ok"
          $startupLog = Join-Path $diagnosticsDirectory "startup.log"

          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null

          $staleXaml = Join-Path $installRoot "Microsoft.UI.Xaml.dll"
          Set-Content -LiteralPath $staleXaml -Value "simulated stale self-contained runtime" -Encoding Ascii

          $installArguments = @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
            "/DIR=`"$installRoot`""
          )
          $installProcess = Start-Process -FilePath $installer -ArgumentList $installArguments -Wait -PassThru
          if ($installProcess.ExitCode -notin @(0, 3010)) {
            throw "A instalação de teste do Lion Pass falhou com o código $($installProcess.ExitCode)."
          }
          if (Test-Path -LiteralPath $staleXaml) {
            throw "O instalador não removeu a Microsoft.UI.Xaml.dll obsoleta."
          }

          $executable = Resolve-Path (Join-Path $installRoot "LionPass.App.exe")

          foreach ($diagnosticFile in @($startupMarker, $startupLog)) {
            if (Test-Path -LiteralPath $diagnosticFile) {
              Remove-Item -LiteralPath $diagnosticFile -Force
            }
          }

          function Write-StartupDiagnostics {
            if (Test-Path -LiteralPath $startupLog) {
              Write-Host "Relatório gerado pelo Lion Pass:"
              Get-Content -LiteralPath $startupLog
            }

            Start-Sleep -Seconds 1
            Write-Host "Eventos recentes do Windows:"
            Get-WinEvent -FilterHashtable @{
              LogName = "Application"
              StartTime = $startedAt.AddSeconds(-2)
            } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match "LionPass|WindowsAppRuntime|Microsoft\.UI\.Xaml" } |
              Select-Object -First 10 TimeCreated, Id, ProviderName, LevelDisplayName, Message |
              Format-List |
              Out-String |
              Write-Host
          }

          $startedAt = Get-Date
          $process = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
            } while (-not $process.HasExited -and -not (Test-Path -LiteralPath $startupMarker) -and [DateTime]::UtcNow -lt $deadline)

            if ($process.HasExited) {
              Write-StartupDiagnostics
              throw "Lion Pass encerrou durante o teste de inicialização. Código: $($process.ExitCode)"
            }

            if (-not (Test-Path -LiteralPath $startupMarker)) {
              Write-StartupDiagnostics
              throw "Lion Pass não confirmou a criação da janela principal dentro de 15 segundos."
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }

            $uninstaller = Join-Path $installRoot "unins000.exe"
            if (Test-Path -LiteralPath $uninstaller) {
              try {
                $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/NORESTART" -Wait -PassThru
                if ($uninstallProcess.ExitCode -ne 0) {
                  Write-Warning "A desinstalação de teste retornou $($uninstallProcess.ExitCode)."
                }
              }
              catch {
                Write-Warning "Não foi possível desinstalar a cópia de teste: $_"
              }
            }
            if (Test-Path -LiteralPath $installRoot) {
              Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.architecture == 'x64' && github.event_name == 'push'
        with:
          name: LionPass-Windows-x64-Unsigned
          path: windows/installer/output/*.exe
          if-no-files-found: error
          retention-days: 1

  sign-package:
    if: github.event_name == 'push'
    needs: build-test-package
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LionPass-Windows-x64-Unsigned
          path: artifacts
      - name: Apply optional Authenticode publisher signature
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            Write-Host "Nenhum certificado Authenticode configurado; a assinatura Sigstore continuará obrigatória."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "lion-pass-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object { $_.Directory.Name -eq "x64" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) { throw "signtool.exe não foi encontrado no runner." }

            Get-ChildItem artifacts -Filter *.exe -File | ForEach-Object {
              & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
                /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar $($_.Name)." }
              $signature = Get-AuthenticodeSignature $_.FullName
              if ($signature.Status -ne "Valid") {
                throw "A assinatura Authenticode de $($_.Name) não pôde ser validada: $($signature.Status)"
              }
            }
          }
          finally {
            if (Test-Path $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lines = Get-ChildItem artifacts -Filter *.exe -File |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name }
          if ($lines.Count -eq 0) { throw "Nenhum instalador Windows foi encontrado." }
          [IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path artifacts) "SHA256SUMS"),
            $lines,
            [Text.UTF8Encoding]::new($false)
          )
      # sigstore/cosign-installer v4.1.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      - name: Sign and verify Windows artifacts with Sigstore
        shell: pwsh
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = @((Get-ChildItem artifacts -Filter *.exe -File)) + @((Get-Item artifacts\SHA256SUMS))
          foreach ($artifact in $artifacts) {
            $bundle = "$($artifact.FullName).sigstore.json"
            & cosign sign-blob --yes --bundle $bundle $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar $($artifact.Name) com Sigstore." }
            & cosign verify-blob $artifact.FullName `
              --bundle $bundle `
              --certificate-identity $env:CERTIFICATE_IDENTITY `
              --certificate-oidc-issuer $env:CERTIFICATE_OIDC_ISSUER
            if ($LASTEXITCODE -ne 0) { throw "Falha ao verificar $($artifact.Name) com Sigstore." }
          }
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LionPass-Windows-x64-Setup
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS
            artifacts/*.sigstore.json
          if-no-files-found: error

name: Linux

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  APPIMAGE_RUNTIME_VERSION: "20251108"
  APPIMAGE_RUNTIME_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"

on:
  push:
    paths: ["linux/**", "shared/**", ".github/workflows/linux-build.yml"]
  pull_request:
    paths: ["linux/**", "shared/**", ".github/workflows/linux-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-dotnet v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "8.0.424"
      - name: Test shared core
        run: dotnet test shared/dotnet/LionPass.Core.Tests/LionPass.Core.Tests.csproj -c Release
      - name: Build Linux application
        run: dotnet build linux/src/LionPass.App/LionPass.App.csproj -c Release
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsecret-tools
      - name: Download and verify pinned AppImage tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum --check --strict
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-x86_64"
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/appimage-runtime" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/appimagetool"
          chmod 0644 "$RUNNER_TEMP/appimage-runtime"
      - name: Build DEB, AppImage and portable archive
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGETOOL_RUNTIME_FILE: ${{ runner.temp }}/appimage-runtime
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: linux/scripts/build-packages.sh linux-x64
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push'
        with:
          name: LionPass-Linux-x64-Unsigned
          path: |
            linux/artifacts/linux-x64/*.deb
            linux/artifacts/linux-x64/*.AppImage
            linux/artifacts/linux-x64/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  sign-package:
    if: github.event_name == 'push'
    needs: build-test-package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LionPass-Linux-x64-Unsigned
          path: artifacts
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -- *.deb *.AppImage *.tar.gz | sort --key=2 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      # sigstore/cosign-installer v4.1.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      - name: Sign and verify Linux artifacts with Sigstore
        working-directory: artifacts
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          for artifact in *.deb *.AppImage *.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
            cosign verify-blob "$artifact" \
              --bundle "$artifact.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER"
          done
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LionPass-Linux-x64
          path: |
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/*.sigstore.json
          if-no-files-found: error

name: Apple

on:
  push:
    paths: ["apple/**", "shared/**", ".github/workflows/apple-build.yml"]
  pull_request:
    paths: ["apple/**", "shared/**", ".github/workflows/apple-build.yml"]

permissions:
  contents: read

jobs:
  macos-tests:
    runs-on: macos-15
    steps:
      # actions/checkout v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test macOS and compatibility fixture
        working-directory: apple
        run: ./scripts/test-macos.sh CODE_SIGNING_ALLOWED=NO

  ios-build:
    runs-on: macos-15
    steps:
      # actions/checkout v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build iOS without signing
        working-directory: apple
        run: xcodebuild build -project LionPass.xcodeproj -scheme LionPass -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO

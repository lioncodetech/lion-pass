name: LotusPassword
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  LotusPassword:
    type: application
    platform: iOS
    sources:
      - path: Sources/LotusPassword
      - path: Sources/LotusCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lotuspassword
        INFOPLIST_FILE: Sources/LotusPassword/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LotusPassword/LotusPassword.entitlements
    dependencies:
      - target: LotusAutoFill
  LotusAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LotusAutoFill
      - path: Sources/LotusCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lotuspassword.autofill
        INFOPLIST_FILE: Sources/LotusAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LotusAutoFill/LotusAutoFill.entitlements
  LotusCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/LotusCoreTests
    dependencies:
      - target: LotusPassword
schemes:
  LotusPassword:
    build:
      targets:
        LotusPassword: all
        LotusAutoFill: all
        LotusCoreTests: [test]
    test:
      targets: [LotusCoreTests]

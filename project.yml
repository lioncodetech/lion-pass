name: LionPassword
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  LionPassword:
    type: application
    platform: iOS
    sources:
      - path: Sources/LionPassword
      - path: Sources/LionCore
      - path: Sources/LionAssets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lionpassword
        INFOPLIST_FILE: Sources/LionPassword/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LionPassword/LionPassword.entitlements
    dependencies:
      - target: LionAutoFill
  LionAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LionAutoFill
      - path: Sources/LionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lionpassword.autofill
        INFOPLIST_FILE: Sources/LionAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LionAutoFill/LionAutoFill.entitlements
  LionCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/LionCoreTests
    dependencies:
      - target: LionPassword
  LionPasswordMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/LionPasswordMac
      - path: Sources/LionCore
      - path: Sources/LionAssets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lioncodetech.lionpassword.mac
        PRODUCT_NAME: Lion Password
        INFOPLIST_FILE: Sources/LionPasswordMac/Info.plist
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        REGISTER_APP_WITH_LAUNCH_SERVICES: NO
schemes:
  LionPassword:
    build:
      targets:
        LionPassword: all
        LionAutoFill: all
        LionCoreTests: [test]
    test:
      targets: [LionCoreTests]
  LionPasswordMac:
    build:
      targets:
        LionPasswordMac: all
    run:
      config: Debug
